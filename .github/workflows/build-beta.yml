name: Build and Publish Beta

# Builds a product's firmware from its beta branch and publishes it as assets
# on a rolling "beta-fw" pre-release. The on-device "Firmware Channel" select
# points OTA updates at these assets. Stable firmware is built and published
# separately by build.yml (push to main -> GitHub Pages).
#
# The caller owns the triggers and the concurrency group, and must grant
# `contents: write` to the job that uses this workflow. See README.md.

on:
  workflow_call:
    inputs:
      variants:
        description: >-
          JSON array of {"key", "yaml", "name"}. key is the manifest key
          (manifest-<key>.json, or plain manifest.json when key is ""), yaml
          is the file to build and name is the artifact name (must start
          with "firmware").
        required: true
        type: string
      esphome-version:
        description: 'ESPHome version to build with (stable, beta, dev or a version)'
        required: false
        type: string
        default: 'stable'
      core-yaml-path:
        description: 'YAML file whose substitutions.version is the beta version'
        required: false
        type: string
        default: 'Integrations/ESPHome/Core.yaml'
      firmware-paths:
        description: >-
          Newline list of paths that count as a firmware change when deciding
          whether a newer beta commit supersedes this build. An entry ending
          in "/" matches everything under it; any other entry matches one file.
          Plain repo-relative paths compared as exact strings: no globs, "//",
          "./", ".." or leading "/" or ":". The run fails on any of these and on
          folders with no tracked files, and warns on untracked files.
        required: false
        type: string
        default: |
          Integrations/ESPHome/
          .github/workflows/build-beta.yml
      beta-branch:
        description: 'Branch that is allowed to publish'
        required: false
        type: string
        default: 'beta'
      release-tag:
        description: 'Release and tag to publish to (change only for a dry run)'
        required: false
        type: string
        default: 'beta-fw'
      skip-non-beta-dispatch:
        description: 'Skip the whole run, builds included, when not on beta-branch'
        required: false
        type: boolean
        default: false

# Least privilege: read-only by default; only publish-beta is elevated to write.
permissions:
  contents: read

# pipefail, so a failed command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  version:
    name: Read version
    # Callers that opt in build nothing off the beta branch; build and
    # publish-beta skip with this job.
    if: ${{ !inputs.skip-non-beta-dispatch || github.ref == format('refs/heads/{0}', inputs.beta-branch) }}
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.read.outputs.v }}
    steps:
      - name: Check inputs
        env:
          VARIANTS: ${{ inputs.variants }}
          BETA_BRANCH: ${{ inputs.beta-branch }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          FIRMWARE_PATHS: ${{ inputs.firmware-paths }}
        run: |
          # These end up in asset names, manifest names and API paths, so a
          # typo fails here instead of publishing something devices can't find.
          if ! jq -e '
              type == "array" and length > 0
              and all(.[]; type == "object"
                and (.key | type == "string" and test("^[A-Za-z0-9._-]*$"))
                and (.yaml | type == "string" and test("^[A-Za-z0-9._/-]+[.]ya?ml$") and (contains("..") | not))
                and (.name | type == "string" and test("^firmware[A-Za-z0-9._-]*$")))
              and ([.[].key] | length == (unique | length))
              and ([.[].name] | length == (unique | length))
            ' <<< "$VARIANTS" > /dev/null; then
            echo "::error::variants must be a non-empty JSON array of {key, yaml, name} with unique keys and names; name must start with 'firmware'."
            exit 1
          fi
          if ! [[ "$BETA_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid beta-branch: $BETA_BRANCH"
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid release-tag: $RELEASE_TAG"
            exit 1
          fi
          jq -r '.[] | "Variant \(.name): \(.yaml) -> manifest\(if .key == "" then "" else "-" + .key end).json"' <<< "$VARIANTS"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check firmware-paths
        env:
          FIRMWARE_PATHS: ${{ inputs.firmware-paths }}
        run: |
          # Matching is literal, not a paths: glob. An entry that matches
          # nothing turns off the newer-commit check, letting an old run
          # publish over newer beta firmware, so fail on anything that is not
          # already in the exact form the compare API reports file names in.
          # git would normalize "a//b", "a/./b" or ":(top)a" and still find
          # files, but the publish check compares raw strings, so reject them.
          n=0
          bad=0
          canon='^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*/?$'
          while IFS= read -r e; do
            e=$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' <<< "$e")
            [ -n "$e" ] || continue
            n=$((n + 1))
            if [[ "$e" == *[\*?\[\]\{\}!]* ]]; then
              echo "::error::firmware-paths entry '$e' has a glob character; use a literal file, or a folder ending in /."
              bad=1
            elif ! [[ "$e" =~ $canon ]] || [[ "$e" == *..* || "$e" == . || "$e" == ./* \
                || "$e" == */. || "$e" == */./* ]]; then
              echo "::error::firmware-paths entry '$e' must be a plain repo-relative path: letters, digits, . _ - and single / between names, no ./ or .. parts, no leading / or :."
              bad=1
            elif [[ "$e" == */ ]]; then
              if [ -z "$(git ls-files --full-name -- ":(literal)$e" | head -n 1)" ]; then
                echo "::error::firmware-paths folder '$e' has no tracked files."
                bad=1
              fi
            elif [ -d "$e" ]; then
              echo "::error::firmware-paths entry '$e' is a folder; end it with / to match the files under it."
              bad=1
            elif ! git ls-files --full-name --error-unmatch -- ":(literal)$e" > /dev/null 2>&1; then
              # A file may be added later, so only warn.
              echo "::warning::firmware-paths file '$e' is not tracked at this commit; it matches nothing."
            fi
          done <<< "$FIRMWARE_PATHS"
          if [ "$n" -eq 0 ]; then
            echo "::error::firmware-paths must list at least one path."
            bad=1
          fi
          exit "$bad"

      - id: read
        env:
          CORE_YAML: ${{ inputs.core-yaml-path }}
        run: |
          v=$(awk '/substitutions:/ {f=1} f && /version:/ {print $2; exit}' \
            "$CORE_YAML" | tr -d '"')
          if [ -z "$v" ]; then
            echo "::error::No substitutions version found in $CORE_YAML"
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Beta version: $v"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.variants) }}
    # 2026.10.3, not 2026.11.0: same build.yml, but 2026.11.0 calls its own
    # actions by tag and keeps the SHAs in a lockfile that is not applied
    # when another repo calls this workflow. 2026.10.3 pins them inline.
    uses: esphome/workflows/.github/workflows/build.yml@e1432c7b31fec7d24a13dc192953ebac836ed98a # 2026.10.3
    with:
      files: ${{ matrix.yaml }}
      esphome-version: ${{ inputs.esphome-version }}
      combined-name: ${{ matrix.name }}
      release-version: ${{ needs.version.outputs.v }}

  publish-beta:
    name: Publish beta release assets
    needs: [version, build]
    # Only the beta branch publishes; the steps check again below.
    if: github.ref == format('refs/heads/{0}', inputs.beta-branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BETA_BRANCH: ${{ inputs.beta-branch }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      FIRMWARE_PATHS: ${{ inputs.firmware-paths }}
      # Reads a compare (built commit...beta) response. Prints 0 when beta has
      # no newer firmware change, a count when it has, "not-contained" when
      # beta does not contain the built commit, and "truncated" when the
      # compare API's 300-file cap may be hiding a firmware change. Renames
      # count under both names.
      HEAD_FILTER: |
        def firmware($p): . as $f
          | any($p[]; . as $q | if ($q | endswith("/")) then ($f | startswith($q)) else $f == $q end);
        ($paths | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $p
        | if (.status == "identical" or .status == "ahead") | not then "not-contained"
          else (.files // [])
          | [length, ([.[] | .filename, (.previous_filename // empty) | select(firmware($p))] | length)]
          | if .[1] == 0 and .[0] >= 300 then "truncated" else .[1] end
          end
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: fw
          pattern: firmware*
          # esphome/workflows puts the artifact name at the top of each
          # artifact, so this gives fw/<name>/<version>/ for one variant or many.
          merge-multiple: true

      - name: Ensure rolling release exists
        run: |
          # Only beta publishes; runs dispatched on other branches build but never
          # touch the release.
          if [ "$GITHUB_REF" != "refs/heads/$BETA_BRANCH" ]; then
            echo "::notice::Not publishing: this run is on $GITHUB_REF, not $BETA_BRANCH."
            exit 0
          fi
          gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" -R "$REPO" \
                 --prerelease --title "Beta (rolling)" \
                 --notes "Latest ${REPO#*/} beta firmware. Auto-updated on every push to the $BETA_BRANCH branch."

      - name: Rewrite manifests to absolute URLs and upload assets
        env:
          VARIANTS: ${{ inputs.variants }}
          CORE_YAML: ${{ inputs.core-yaml-path }}
        run: |
          # Only beta publishes; runs dispatched on other branches build but never
          # touch the release.
          if [ "$GITHUB_REF" != "refs/heads/$BETA_BRANCH" ]; then
            echo "::notice::Not publishing: this run is on $GITHUB_REF, not $BETA_BRANCH."
            exit 0
          fi
          # Publish unless a newer beta commit changes firmware: that commit has its
          # own queued run, which publishes instead. A re-run of an old build can
          # never roll beta back, and docs-only pushes mid-build don't block it.
          cmp=$(gh api "repos/$REPO/compare/${GITHUB_SHA}...${BETA_BRANCH}" \
            --jq '{status, files: [(.files // [])[] | {filename, previous_filename}]}')
          newer=$(jq -r --arg paths "$FIRMWARE_PATHS" "$HEAD_FILTER" <<< "$cmp")
          case "$newer" in
            0) ;;
            truncated)
              echo "::warning::Not publishing ${GITHUB_SHA::7}: $BETA_BRANCH is 300+ changed files ahead, too many to check for firmware changes. Run this workflow manually on $BETA_BRANCH to publish its head."
              exit 0 ;;
            *)
              echo "::notice::Not publishing ${GITHUB_SHA::7}: $BETA_BRANCH has newer firmware changes or does not contain this commit."
              exit 0 ;;
          esac
          BASE="https://github.com/$REPO/releases/download/$RELEASE_TAG"
          # Each build uploads under its own names, so the manifest devices are
          # reading always points at files that exist and match it. The run ID,
          # not the run number: run numbers count per workflow file, so another
          # caller file (or the old per-repo workflow) reuses them.
          BUILD="r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          # Bins the live manifests point at stay one more build, so a device that
          # checked before this publish can still install what it was offered.
          # Old bins are only deleted when every live manifest parses in full;
          # anything less skips cleanup this round.
          # The live manifests also feed the version check below, so failing to
          # list or download them fails the run (before anything is uploaded)
          # instead of letting a same-version build through unchecked.
          SKIP_CLEANUP=
          KEEP=""
          rm -rf prev
          mkdir -p prev
          if ! rel_assets=$(gh release view "$RELEASE_TAG" -R "$REPO" --json assets --jq '.assets'); then
            echo "::error::Could not list the $RELEASE_TAG assets, so the live beta version could not be checked; nothing was published. Re-run this job."
            exit 1
          fi
          live=$(jq -r '.[].name | select(test("^manifest.*[.]json$"))' <<< "$rel_assets")
          if [ -n "$live" ]; then
            if ! gh release download "$RELEASE_TAG" -R "$REPO" -p 'manifest*.json' -D prev --clobber; then
              echo "::error::Could not download the live $RELEASE_TAG manifests, so the live beta version could not be checked; nothing was published. Re-run this job."
              exit 1
            fi
            while IFS= read -r m; do
              if [ ! -s "prev/$m" ]; then
                echo "::error::The live $m did not download, so the live beta version could not be checked; nothing was published. Re-run this job."
                exit 1
              fi
            done <<< "$live"
            # A manifest that downloaded but does not parse only skips cleanup:
            # publishing over it is the repair.
            while IFS= read -r m; do
              if refs=$(jq -r '[.builds[] | .ota.path, ((.parts // [])[].path)]
                    | if length == 0 or any(.[]; type != "string") then error("no firmware paths")
                      else .[] | sub(".*/"; "") end' "prev/$m" 2>/dev/null) && [ -n "$refs" ]; then
                KEEP+="$refs"$'\n'
              else
                echo "::warning::Could not read the live $m; keeping all old firmware this round."
                SKIP_CLEANUP=1
              fi
            done <<< "$live"
          fi
          # Pass 1 prepares and checks every variant; nothing is uploaded until
          # all of them pass, so a bad build changes nothing on the release.
          rm -rf staged
          mkdir -p staged
          SAME=""
          SAME_V=""
          SAME_RIDS=""
          while IFS= read -r variant; do
            key=$(jq -r '.key' <<< "$variant")
            name=$(jq -r '.name' <<< "$variant")
            src="fw/$name"
            # key "" is the single-variant layout: manifest.json, bins "$BUILD-*".
            if [ -n "$key" ]; then
              pfx="$key-$BUILD-"
              out="manifest-$key.json"
            else
              pfx="$BUILD-"
              out="manifest.json"
            fi
            man=$(find "$src" -name manifest.json 2>/dev/null | head -1)
            if [ -z "$man" ]; then
              echo "::error::manifest.json not found for $name"
              exit 1
            fi
            # Variants share a device name, so their bin filenames match.
            # Release assets are a flat namespace: prefix per variant and build.
            find "$src" -name '*.bin' | while read -r bin; do
              mv "$bin" "$(dirname "$bin")/$pfx$(basename "$bin")"
            done
            find "$src" -name '*.bin' > "staged/$out.bins"
            echo "Rewriting $man -> $out"
            # Make ota.path and parts[].path absolute release-asset URLs so the
            # device never has to resolve a relative path against a redirect.
            jq --arg base "$BASE" --arg pfx "$pfx" '
              .builds[0].ota.path = ($base + "/" + $pfx + (.builds[0].ota.path | sub(".*/"; "")))
              | .builds[0].parts |= map(.path = ($base + "/" + $pfx + (.path | sub(".*/"; ""))))
            ' "$man" > "staged/$out"
            cat "staged/$out"
            # The manifest may only name bins this build uploads: every path is
            # an asset URL for this variant and build, and each one was built.
            if ! jq -r --arg url "$BASE/$pfx" '
                  [.builds[] | .ota.path, ((.parts // [])[].path)]
                  | if length == 0 or any(.[]; type != "string" or (startswith($url) | not))
                    then error("bad firmware paths") else .[] | sub(".*/"; "") end' \
                  "staged/$out" | sort -u > "staged/$out.want"; then
              echo "::error::$out has a missing or non-$RELEASE_TAG firmware path for $name"
              exit 1
            fi
            have=$(while IFS= read -r bin; do basename "$bin"; done < "staged/$out.bins" | sort)
            if [ -z "$have" ] || [ -n "$(uniq -d <<< "$have")" ]; then
              echo "::error::Expected uniquely named .bin files for $name, found: ${have:-none}"
              exit 1
            fi
            missing=$(comm -23 "staged/$out.want" <(printf '%s\n' "$have"))
            if [ -n "$missing" ]; then
              echo "::error::$out names bins that $name did not build: $missing"
              exit 1
            fi
            # A device is offered an update only when the manifest version
            # differs from its own, so a live manifest that already has this
            # version hides this build. Collected here, judged after the loop.
            # Bins from an earlier attempt of this run are this same commit.
            new_v=$(jq -r '.version // empty' "staged/$out")
            if [ -s "prev/$out" ]; then
              if ! live_v=$(jq -r '.version // empty' "prev/$out" 2>/dev/null); then
                echo "::warning::Could not read the version of the live $out; not checking it for a version clash."
              elif [ -n "$new_v" ] && [ "$new_v" = "$live_v" ] \
                  && ! jq -e --arg p "${key:+$key-}r${GITHUB_RUN_ID}." \
                       '[.builds[].ota.path | sub(".*/"; "")] | length > 0 and all(.[]; startswith($p))' \
                       "prev/$out" > /dev/null 2>&1; then
                SAME+="$out "
                SAME_V="$new_v"
                # Bins this workflow uploaded are named <key->r<run ID>.<attempt>-,
                # which names the run, and so the commit, that published them.
                rid=$(jq -r --arg p "${key:+$key-}r" '
                    [.builds[].ota.path | sub(".*/"; "") | select(startswith($p)) | ltrimstr($p)
                     | (capture("^(?<id>[0-9]+)[.][0-9]+-") // {id: null}).id]
                    | unique | if length == 1 and .[0] != null then .[0] else "" end' \
                    "prev/$out" 2>/dev/null) || rid=""
                SAME_RIDS+="${rid:--} "
              fi
            fi
          done < <(jq -c '.[]' <<< "$VARIANTS")
          # Same version as the live beta is fine for the commit that is already
          # published and for commits that change no firmware since. Otherwise
          # stop before anything is uploaded.
          if [ -n "$SAME" ]; then
            # Which commit is live is asked of the run that uploaded the live
            # manifests, not only the tag: the older per-repo workflow uploaded
            # without moving the tag, and a run can upload and then fail before
            # moving it. Run IDs in the bin names come first; for older bins,
            # the one run of this workflow file on $BETA_BRANCH that was running
            # when the manifest was uploaded. The runs API is public for public
            # repos, so no extra token permission is needed. If neither works,
            # or the variants disagree, the tag is used.
            wf=${GITHUB_WORKFLOW_REF#"$REPO"/}
            wf=${wf%%@*}
            runs=""
            pub=""
            pub_ok=1
            read -r -a outs <<< "$SAME"
            read -r -a rids <<< "$SAME_RIDS"
            for i in "${!outs[@]}"; do
              o=${outs[$i]}
              rid=${rids[$i]}
              s=""
              if [ "$rid" != - ] && r=$(gh api "repos/$REPO/actions/runs/$rid" 2>/dev/null); then
                s=$(jq -r --arg b "$BETA_BRANCH" '
                    select(.head_branch == $b and (.event == "push" or .event == "workflow_dispatch"))
                    | .head_sha // empty' <<< "$r") || s=""
              fi
              if [ -z "$s" ]; then
                t=$(jq -r --arg n "$o" '.[] | select(.name == $n) | .updatedAt // empty' <<< "$rel_assets")
                if [ -z "$runs" ]; then
                  runs=$(gh api "repos/$REPO/actions/runs?branch=$BETA_BRANCH&per_page=100" --jq '.workflow_runs' 2>/dev/null) || runs=""
                fi
                if [ -n "$t" ] && [ -n "$runs" ]; then
                  s=$(jq -r --arg t "$t" --arg wf "$wf" '
                      [.[] | select(.path == $wf and (.event == "push" or .event == "workflow_dispatch")
                                    and .run_started_at <= $t and .updated_at >= $t) | .head_sha]
                      | unique | if length == 1 then .[0] else "" end' <<< "$runs") || s=""
                fi
              fi
              if ! [[ "$s" =~ ^[0-9a-f]{40}$ ]]; then
                pub_ok=0
              elif [ -z "$pub" ]; then
                pub=$s
              elif [ "$pub" != "$s" ]; then
                pub_ok=0
              fi
            done
            if [ "$pub_ok" = 1 ] && [ -n "$pub" ]; then
              base=$pub
              src="the run that uploaded it"
            else
              base=$(gh api "repos/$REPO/commits/tags/$RELEASE_TAG" --jq '.sha' 2>/dev/null) || base=""
              src="the $RELEASE_TAG tag, as the run that uploaded it could not be identified"
            fi
            echo "Live version $SAME_V (${SAME% }) was published from ${base:-an unknown commit} (from $src)."
            if [ "$base" = "$GITHUB_SHA" ]; then
              echo "::notice::$RELEASE_TAG already serves version $SAME_V from this commit; publishing it again."
            else
              # Firmware paths must be the same at both commits, whichever is
              # older: the live commit can be ahead when an older commit is
              # re-run after a later no-firmware commit was published.
              changed=unknown
              cq='{status, files: [(.files // [])[] | {filename, previous_filename}]}'
              if [[ "$base" =~ ^[0-9a-f]{40}$ ]] \
                  && c=$(gh api "repos/$REPO/compare/${base}...${GITHUB_SHA}" --jq "$cq" 2>/dev/null); then
                if [ "$(jq -r '.status' <<< "$c")" = behind ]; then
                  c=$(gh api "repos/$REPO/compare/${GITHUB_SHA}...${base}" --jq "$cq" 2>/dev/null) || c=""
                fi
                if [ -n "$c" ]; then
                  # Workflow files rebuild beta but don't change the firmware,
                  # so they never need a version bump.
                  fw_src=$(grep -v '^[[:space:]]*[.]github/' <<< "$FIRMWARE_PATHS" || true)
                  changed=$(jq -r --arg paths "$fw_src" "$HEAD_FILTER" <<< "$c")
                fi
              fi
              if [ "$changed" != 0 ]; then
                if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
                  from="a commit that could not be identified (no publishing run found, $RELEASE_TAG tag unreadable)"
                  why="so ${GITHUB_SHA::7} cannot be shown to carry the same firmware"
                else
                  from="commit ${base::7} (from $src)"
                  case "$changed" in
                    unknown) why="and the two could not be compared" ;;
                    not-contained) why="and ${GITHUB_SHA::7} is not on the same history as it" ;;
                    truncated) why="and they differ in 300+ files, too many to check for firmware changes" ;;
                    *) why="and ${GITHUB_SHA::7} differs from it in $changed firmware file(s)" ;;
                  esac
                fi
                echo "::error title=Beta version not bumped::$RELEASE_TAG already serves version $SAME_V (${SAME% }) from $from, $why. Devices compare versions as strings, so they would never be offered this build. Bump substitutions.version in $CORE_YAML on $BETA_BRANCH and push; nothing was published."
                exit 1
              fi
              echo "::notice::Version $SAME_V is already live, but no firmware path differs between ${base::7} and ${GITHUB_SHA::7}; publishing."
            fi
          fi
          # Pass 2 uploads. Firmware first, and a manifest only once the release
          # lists every bin it names. A failed upload fails the step.
          while IFS= read -r key; do
            out="manifest${key:+-$key}.json"
            bins=()
            while IFS= read -r bin; do
              bins+=("$bin")
            done < "staged/$out.bins"
            gh release upload "$RELEASE_TAG" -R "$REPO" --clobber "${bins[@]}"
            rel=$(gh release view "$RELEASE_TAG" -R "$REPO" --json assets --jq '.assets[].name' | sort -u)
            missing=$(comm -23 "staged/$out.want" <(printf '%s\n' "$rel"))
            if [ -n "$missing" ]; then
              echo "::error::Not uploading $out: the release is missing $missing"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "staged/$out" -R "$REPO" --clobber
          done < <(jq -r '.[].key' <<< "$VARIANTS")
          # Drop bins that neither this build nor the previous one uses. Failures
          # here only leave extra files behind, so they are warnings.
          if [ -n "$SKIP_CLEANUP" ]; then
            echo "Skipping stale asset cleanup this round."
          else {
            gh release view "$RELEASE_TAG" -R "$REPO" --json assets \
              | jq -r --arg build "$BUILD-" --arg keep "$KEEP" \
                  '($keep | split("\n")) as $k | .assets[].name
                   | select(endswith(".bin") and (contains($build) | not) and (IN($k[]) | not))' \
              | while read -r old; do
                  echo "Deleting stale asset $old"
                  gh release delete-asset "$RELEASE_TAG" "$old" -R "$REPO" -y < /dev/null \
                    || echo "::warning::Could not delete stale beta asset $old; it stays on the release."
                done
          } || echo "::warning::Stale beta asset cleanup failed; old files left on the release."
          fi
          echo "Beta assets published."

      - name: Point release tag at the built commit
        run: |
          # Only beta publishes; runs dispatched on other branches build but never
          # touch the release.
          if [ "$GITHUB_REF" != "refs/heads/$BETA_BRANCH" ]; then
            echo "::notice::Not publishing: this run is on $GITHUB_REF, not $BETA_BRANCH."
            exit 0
          fi
          # Same check as the upload step, again: a newer firmware commit may
          # have landed during the upload, and its run moves the tag instead.
          cmp=$(gh api "repos/$REPO/compare/${GITHUB_SHA}...${BETA_BRANCH}" \
            --jq '{status, files: [(.files // [])[] | {filename, previous_filename}]}')
          newer=$(jq -r --arg paths "$FIRMWARE_PATHS" "$HEAD_FILTER" <<< "$cmp")
          case "$newer" in
            0) ;;
            truncated)
              echo "::warning::Not moving $RELEASE_TAG to ${GITHUB_SHA::7}: $BETA_BRANCH is 300+ changed files ahead, too many to check for firmware changes."
              exit 0 ;;
            *)
              echo "::notice::Not moving $RELEASE_TAG to ${GITHUB_SHA::7}: $BETA_BRANCH has newer firmware changes or does not contain this commit."
              exit 0 ;;
          esac
          # gh release create tags default-branch HEAD, and uploads never move
          # the tag, so without this the release's source commit drifts away
          # from the assets actually published.
          gh api -X PATCH "repos/$REPO/git/refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" -F force=true
          echo "$RELEASE_TAG -> $GITHUB_SHA"

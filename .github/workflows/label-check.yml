on:
  workflow_call:

jobs:
  label-check:
    runs-on: ubuntu-latest
    steps:
      - name: Write PR Body to File
        # Pass the body through an environment variable instead of
        # interpolating it into the script, so PR content can never be
        # executed as shell code. Required for pull_request_target callers,
        # which run with a write token. The checkout step was removed
        # because no repository files are used.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > pr_body.txt
      - name: Determine Single Label
        id: determine_label
        run: |
          label=""

          # 1) Bugfix
          if grep -qE '^- \[x\] Bugfix' pr_body.txt; then
            label="bugfix"

          # 2) New feature
          elif grep -qE '^- \[x\] New feature' pr_body.txt; then
            label="new-feature"

          # 3) Breaking change
          elif grep -qE '^- \[x\] Breaking change' pr_body.txt; then
            label="breaking-change"

          # 4) Dependency update
          elif grep -qE '^- \[x\] Dependency Update - Does not publish' pr_body.txt; then
            label="dependency-update"
          fi

          echo "Chosen label: $label"
          echo "chosen_label=$label" >> $GITHUB_OUTPUT
      - name: Apply Single Label
        if: ${{ steps.determine_label.outputs.chosen_label != '' }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.determine_label.outputs.chosen_label }}